name: Patch Messaging Schema Lock Temporary

on:
  push:
    branches:
      - agent/regenerate-supabase-types-20260815
    paths:
      - .github/workflows/patch-messaging-schema-lock-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/regenerate-supabase-types-20260815

      - name: Align messaging ownership columns in schema lock
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/PRODUCTION_SCHEMA_LOCK.sql')
          text = path.read_text()

          tables = ['messaging_contacts', 'messaging_conversations', 'messaging_messages', 'messaging_queue']
          for table in tables:
              marker = f"create table if not exists public.{table} (\n  id uuid primary key default gen_random_uuid(),"
              replacement = marker + "\n  user_id uuid not null references auth.users(id) on delete cascade,"
              if replacement not in text:
                  if marker not in text:
                      raise SystemExit(f'missing create marker for {table}')
                  text = text.replace(marker, replacement, 1)

          convergence = """
-- Messaging ownership columns are required in the live production schema.
-- Keep fresh databases strict while adding the columns safely to older shapes.
alter table public.messaging_contacts
  add column if not exists user_id uuid references auth.users(id) on delete cascade;
alter table public.messaging_conversations
  add column if not exists user_id uuid references auth.users(id) on delete cascade;
alter table public.messaging_messages
  add column if not exists user_id uuid references auth.users(id) on delete cascade;
alter table public.messaging_queue
  add column if not exists user_id uuid references auth.users(id) on delete cascade;

"""
          anchor = "create index if not exists messaging_contacts_activity_idx"
          if convergence.strip() not in text:
              if anchor not in text:
                  raise SystemExit('missing messaging index anchor')
              text = text.replace(anchor, convergence + anchor, 1)

          path.write_text(text)
          PY

      - name: Validate schema contract
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm validate:db-contract

      - name: Commit schema lock patch
        run: |
          if git diff --quiet -- supabase/PRODUCTION_SCHEMA_LOCK.sql; then
            echo 'Schema lock already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/PRODUCTION_SCHEMA_LOCK.sql
          git commit -m 'fix: align messaging ownership in schema lock'
          git push origin HEAD:agent/regenerate-supabase-types-20260815
