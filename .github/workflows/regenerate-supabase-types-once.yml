name: Regenerate Supabase Types Once

on:
  push:
    branches:
      - feature/daily-profile-report-emails
    paths:
      - ".github/workflows/regenerate-supabase-types-once.yml"

permissions:
  contents: write

concurrency:
  group: regenerate-supabase-types-once
  cancel-in-progress: false

jobs:
  regenerate:
    name: Generate types and typecheck
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/daily-profile-report-emails
          fetch-depth: 0

      - name: Validate Supabase configuration
        shell: bash
        run: |
          project_ref="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
          if [ -z "$project_ref" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not configured"
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate database types
        run: supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" > src/integrations/supabase/types.ts

      - name: Verify analytics type contract
        shell: bash
        run: |
          grep -q "profile_view_analytics:" src/integrations/supabase/types.ts
          grep -q "session_id: string | null" src/integrations/supabase/types.ts
          grep -q "viewer_city: string | null" src/integrations/supabase/types.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Commit generated types and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-supabase-types-once.yml
          git add src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "No generated type changes to commit"
            exit 0
          fi
          git commit -m "fix(types): regenerate Supabase database types"
          git push origin HEAD:feature/daily-profile-report-emails
