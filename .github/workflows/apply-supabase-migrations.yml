name: Apply Supabase Migrations

# Applies pending SQL migrations in supabase/migrations/ to production.
# Migration history is canonical and forward-only: this workflow never edits
# supabase_migrations.schema_migrations and never uses migration repair.
#
# Requirements:
#   - Secret   SUPABASE_ACCESS_TOKEN
#   - Secret   SUPABASE_DB_PASSWORD
#   - Variable SUPABASE_PROJECT_REF

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/apply-supabase-migrations.yml"
  workflow_dispatch: {}

concurrency:
  group: apply-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize project ref
        run: echo "SUPABASE_PROJECT_REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Verify required config is present
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Variable SUPABASE_PROJECT_REF is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify migration history parity
        run: supabase migration list

      - name: Apply pending migrations
        run: supabase db push --include-all
