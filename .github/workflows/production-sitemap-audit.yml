name: Production Sitemap Audit

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

concurrency:
  group: production-sitemap-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Validate production sitemap and indexability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production sitemap, robots, canonicals, and indexability
        id: audit
        continue-on-error: true
        env:
          SITEMAP_STRICT: "1"
          SITEMAP_VALIDATION_BASE_URL: https://www.masseurmatch.com
          SITEMAP_CANONICAL_ORIGIN: https://www.masseurmatch.com
          SITEMAP_VALIDATION_CONCURRENCY: "6"
          SITEMAP_VALIDATION_MAX_URLS: "5000"
        run: node scripts/validate-sitemap.mjs > production-sitemap-audit.log 2>&1

      - name: Upload production audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-sitemap-audit
          path: production-sitemap-audit.log
          retention-days: 30
          if-no-files-found: error

      - name: Close resolved production sitemap alert
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production sitemap audit failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "seo,automated-alert",
              per_page: 100,
            });

            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by successful production audit run ${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Open or update production sitemap alert
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const title = "Production sitemap audit failed";
            const log = fs.readFileSync("production-sitemap-audit.log", "utf8");
            const excerpt = log.length > 12000 ? `${log.slice(0, 12000)}\n\n...log truncated` : log;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled production SEO audit detected a live sitemap or indexability regression.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "The validator checks every URL in `/sitemap.xml` for HTTP 200, indexability, robots access, and matching canonical URLs.",
              "",
              "```text",
              excerpt,
              "```",
            ].join("\n");

            for (const label of [
              { name: "seo", color: "1d76db", description: "Search engine optimization" },
              { name: "automated-alert", color: "d93f0b", description: "Created or updated by automation" },
            ]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "seo,automated-alert",
              per_page: 100,
            });
            const existing = issues.find((item) => item.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["seo", "automated-alert"],
              });
            }

      - name: Enforce clean production sitemap
        if: steps.audit.outcome == 'failure'
        run: |
          cat production-sitemap-audit.log
          exit 1

      - name: Publish successful result
        if: steps.audit.outcome == 'success'
        run: cat production-sitemap-audit.log
