name: Deploy Supabase Functions

# Auto-deploys production Edge Functions that must stay in lockstep with the
# repository. Functions with verify_jwt=false must implement their own verified
# webhook/token authentication or be intentionally public read-only endpoints.
#
# Requirements:
#   - Secret   SUPABASE_ACCESS_TOKEN
#   - Variable SUPABASE_PROJECT_REF

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/auth-email-hook/**"
      - "supabase/functions/cloudinary-sign/**"
      - "supabase/functions/process-lifecycle-email-queue/**"
      - "supabase/functions/lifecycle-unsubscribe/**"
      - "supabase/functions/run-lifecycle-campaigns/**"
      - "supabase/functions/run-post-signup-campaigns/**"
      - "supabase/functions/send-city-digest/**"
      - "supabase/functions/create-checkout/**"
      - "supabase/functions/customer-portal/**"
      - "supabase/functions/moderate-photo/**"
      - "supabase/functions/moderate-text/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize project ref
        run: echo "SUPABASE_PROJECT_REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Verify required config is present
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Variable SUPABASE_PROJECT_REF is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authentication and upload functions
        run: |
          supabase functions deploy auth-email-hook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy cloudinary-sign --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy lifecycle email functions
        run: |
          supabase functions deploy process-lifecycle-email-queue --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy lifecycle-unsubscribe --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy run-lifecycle-campaigns --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy run-post-signup-campaigns --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-city-digest --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy billing functions
        run: |
          supabase functions deploy create-checkout --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy customer-portal --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy moderation functions
        run: |
          supabase functions deploy moderate-photo --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy moderate-text --project-ref "$SUPABASE_PROJECT_REF"
