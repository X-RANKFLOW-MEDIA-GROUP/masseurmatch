name: Deploy Supabase Production

# Canonical production deploy. Database migrations run first; Edge Functions
# deploy only after the migration job succeeds. This prevents a new function
# from depending on schema/RPC changes that have not reached production yet.
#
# Requirements:
#   - Secret   SUPABASE_ACCESS_TOKEN
#   - Secret   SUPABASE_DB_PASSWORD
#   - Variable SUPABASE_PROJECT_REF

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize project ref
        run: echo "SUPABASE_PROJECT_REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Verify required config is present
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify migration history parity
        run: supabase migration list

      - name: Apply pending migrations
        run: supabase db push --include-all

  deploy:
    name: Deploy Supabase Edge Functions
    needs: migrate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize project ref
        run: echo "SUPABASE_PROJECT_REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Verify required config is present
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Variable SUPABASE_PROJECT_REF is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authentication and upload functions
        run: |
          supabase functions deploy auth-email-hook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy cloudinary-sign --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy lifecycle email functions
        run: |
          supabase functions deploy process-lifecycle-email-queue --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy lifecycle-unsubscribe --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy run-lifecycle-campaigns --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy run-post-signup-campaigns --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-city-digest --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy billing functions
        run: |
          supabase functions deploy create-checkout --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy customer-portal --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy messaging webhooks
        run: |
          supabase functions deploy resend-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy twilio-inbound --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy moderation functions
        run: |
          supabase functions deploy moderate-photo --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy moderate-text --project-ref "$SUPABASE_PROJECT_REF"
